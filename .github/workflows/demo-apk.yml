name: Demo APK

# Builds an installable debug APK (FortWeb wallet + Fort Demo launcher) on every
# push to dev and publishes it to the rolling "demo-latest" pre-release, so it
# can be downloaded straight onto a phone from the repository's Releases page.
# The same release carries the wallet for a desktop browser, built from the same
# wallet payload.

permissions:
  contents: write

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: demo-apk
  cancel-in-progress: true

jobs:
  demo-apk:
    name: Build and publish demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Fortoid
        uses: actions/checkout@v4

      # The wallet payload is best-effort: if the FortWeb producer build fails,
      # still ship an APK so the native demo stays installable.
      - name: Prepare canonical FortWeb runtime
        id: payload
        continue-on-error: true
        uses: ./.github/actions/prepare-fortweb-runtime

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          if [ "${{ steps.payload.outcome }}" = "success" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            echo "::warning::FortWeb payload unavailable; building demo-only APK"
            ./gradlew :app:assembleDebug -x verifyPreparedPayload --no-daemon
          fi
          cp app/build/outputs/apk/debug/app-debug.apk fortoid-demo.apk

      # The wallet for a computer is the payload the APK carries, with the pinned
      # wallet's own start script. No payload, no wallet for the computer.
      - name: Build the wallet for a computer
        id: desktop
        if: steps.payload.outcome == 'success'
        run: |
          set -euo pipefail
          # The pinned wallet's commit decides: an earlier wallet has no start script, and then no wallet for a computer.
          IN_COMMIT="$(git -C .deps/fortweb ls-tree --name-only HEAD -- scripts/start_wallet.py)"
          if [ -z "$IN_COMMIT" ]; then
            echo "The pinned wallet has no start script (scripts/start_wallet.py), so no wallet for a computer is built."
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The wallet's build ran in that checkout: the start script must still be its commit's.
          if ! git -C .deps/fortweb diff --quiet HEAD -- scripts/start_wallet.py; then
            echo "::error::.deps/fortweb/scripts/start_wallet.py is not the one in the pinned wallet's commit"
            exit 1
          fi
          OUT="$(python3 tools/build_desktop_wallet.py \
            --payload app/src/main/assets/payload \
            --start-script .deps/fortweb/scripts/start_wallet.py \
            --readme desktop/README.txt \
            --output fort-wallet-desktop.zip)"
          echo "$OUT"
          echo "sha256=${OUT#DESKTOP_WALLET_SHA256=}" >> "$GITHUB_OUTPUT"
          echo "state=built" >> "$GITHUB_OUTPUT"

      - name: Publish demo-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ steps.payload.outcome }}
          DESKTOP_SHA256: ${{ steps.desktop.outputs.sha256 }}
          DESKTOP_STATE: ${{ steps.desktop.outputs.state }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ASSETS=(fortoid-demo.apk)
          DESKTOP="There is no wallet for the computer in this build."
          if [ "$PAYLOAD" = "success" ]; then
            # The build step says built or none; anything else stops here, before the release is touched.
            case "$DESKTOP_STATE" in
              built)
                # The zip goes out only with its own digest: both are checked before the release is touched.
                if ! [[ "$DESKTOP_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
                  ! echo "${DESKTOP_SHA256}  fort-wallet-desktop.zip" | sha256sum --check --strict --quiet -; then
                  echo "::error::fort-wallet-desktop.zip is missing or is not the file the build step gave a SHA-256 for"
                  exit 1
                fi
                ASSETS+=(fort-wallet-desktop.zip)
                DESKTOP="On a computer: download fort-wallet-desktop.zip, unzip it, and in the
          folder \`fort-wallet\` that comes out run \`python3 start-wallet.py\`
          (on Windows: \`py start-wallet.py\`). The wallet opens in the
          browser at \`http://127.0.0.1:8791/\`. It needs Python 3.9 or later. Use Chrome or Edge,
          and one tab. The phone app and this download are the same wallet build.
          SHA-256 of fort-wallet-desktop.zip: ${DESKTOP_SHA256}"
                ;;
              none)
                ;;
              *)
                echo "::error::the step that builds the wallet for a computer gave the state '${DESKTOP_STATE}', not built or none"
                exit 1
                ;;
            esac
            WALLET="Includes the FortWeb wallet (KERI Wallet icon). A wallet made with a build from before the credential engine is not shown by a build that has it, nor the other way round: each keeps its storage in its own place."
          else
            WALLET="FortWeb wallet build failed for this commit; only the Fort Demo icon works."
          fi
          NOTES="Debug build of ${SHORT_SHA}. ${WALLET}

          Install on Android: open this page on the phone, tap fortoid-demo.apk,
          and allow installs from your browser when asked. Newer builds install
          over older ones.

          Then open the **Fort Demo** icon to try the native phone features.

          ${DESKTOP}"

          gh release delete demo-latest --yes --cleanup-tag || true
          gh release create demo-latest "${ASSETS[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Fortoid demo (${SHORT_SHA})" \
            --notes "$NOTES"
